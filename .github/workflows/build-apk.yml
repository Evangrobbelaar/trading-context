name: Build SA Touring APK

on:
  push:
    branches: [main, claude/sa-touring-toolkit-apk-5v2d57]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sa-touring-app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Patch expo-modules-core for Gradle 8.x (components.release)
        run: |
          python3 - <<'PYEOF'
import glob, re

files = glob.glob('node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle')
if not files:
    print("ExpoModulesCorePlugin.gradle not found - skipping patch")
else:
    path = files[0]
    print(f"Patching: {path}")
    with open(path) as f:
        content = f.read()
    # Show lines containing 'components'
    for i, line in enumerate(content.split('\n'), 1):
        if 'components' in line:
            print(f"  line {i}: {line}")
    # Fix: replace direct components.release access with safe findByName
    patched = re.sub(
        r'\bfrom\s+components\.release\b',
        'def __rc = components.findByName("release"); if (__rc) { from __rc }',
        content
    )
    if patched != content:
        with open(path, 'w') as f:
            f.write(patched)
        print("Patched: wrapped components.release in findByName guard")
    else:
        print("No direct components.release found - checking for other patterns")
        # Also try without word boundary for edge cases
        patched2 = content.replace(
            'from components.release',
            'def __rc = components.findByName("release"); if (__rc) { from __rc }'
        )
        if patched2 != content:
            with open(path, 'w') as f:
                f.write(patched2)
            print("Patched via string replace")
        else:
            print("No patch applied - file may already be compatible")
PYEOF

      - name: Create placeholder assets (valid PNG via Python)
        run: |
          mkdir -p assets
          python3 - <<'PYEOF'
import struct, zlib

def make_png(w=1, h=1, r=0, g=100, b=50):
    def chunk(tag, data):
        c = zlib.crc32(tag + data) & 0xffffffff
        return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
    ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
    raw = b'\x00' + bytes([r, g, b]) * w
    idat = zlib.compress(raw * h)
    return (b'\x89PNG\r\n\x1a\n' +
            chunk(b'IHDR', ihdr) +
            chunk(b'IDAT', idat) +
            chunk(b'IEND', b''))

png = make_png()
for name in ['icon.png', 'splash.png', 'adaptive-icon.png', 'favicon.png']:
    with open(f'assets/{name}', 'wb') as f:
        f.write(png)
    print(f'Created assets/{name}')
PYEOF
          ls -la assets/

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Show prebuild output
        if: always()
        run: ls -la android/ 2>/dev/null || echo "No android dir"

      - name: Patch settings.gradle - add expo-modules-core to pluginManagement
        run: |
          echo "=== android/settings.gradle (before patch) ==="
          cat android/settings.gradle
          echo ""
          python3 - <<'PYEOF'
import subprocess, sys

result = subprocess.run(
    ['node', '--print',
     "require('path').dirname(require.resolve('expo-modules-core/package.json')) + '/android'"],
    capture_output=True, text=True
)
if result.returncode != 0:
    print(f"ERROR resolving expo-modules-core: {result.stderr}")
    sys.exit(1)

expo_core = result.stdout.strip()
print(f"expo-modules-core/android: {expo_core}")

with open('android/settings.gradle') as f:
    content = f.read()

include_line = f'  includeBuild("{expo_core}")'

if expo_core in content:
    print("expo-modules-core already present in settings.gradle - no patch needed")
elif 'pluginManagement {' in content:
    content = content.replace('pluginManagement {', f'pluginManagement {{\n{include_line}', 1)
    with open('android/settings.gradle', 'w') as f:
        f.write(content)
    print("Patched: added expo-modules-core to existing pluginManagement block")
else:
    pm = (
        'pluginManagement {\n'
        + include_line + '\n'
        + '  repositories {\n'
        + '    google()\n'
        + '    mavenCentral()\n'
        + '    gradlePluginPortal()\n'
        + '  }\n'
        + '}\n'
    )
    content = pm + content
    with open('android/settings.gradle', 'w') as f:
        f.write(content)
    print("Patched: prepended new pluginManagement block")

print("=== android/settings.gradle (after patch) ===")
with open('android/settings.gradle') as f:
    print(f.read())
PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -200
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Find and copy APK
        run: |
          echo "=== All APK files found ==="
          find android -name "*.apk" -type f
          APK=$(find android -name "app-debug.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No app-debug.apk found - build likely failed"
            exit 1
          fi
          echo "APK: $APK"
          mkdir -p output
          cp "$APK" output/SA-Touring-Toolkit-v1.0.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-Touring-Toolkit-APK
          path: sa-touring-app/output/SA-Touring-Toolkit-v1.0.apk
          retention-days: 30

      - name: Done
        run: |
          echo "========================================"
          echo "  APK BUILD COMPLETE"
          echo "  Download from GitHub Actions:"
          echo "  Repo → Actions tab → this run → Artifacts"
          echo "========================================"
