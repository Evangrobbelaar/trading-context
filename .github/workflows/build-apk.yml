name: Build SA Touring APK

on:
  push:
    branches: [main, claude/sa-touring-toolkit-apk-5v2d57]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sa-touring-app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Patch ExpoModulesCorePlugin for Gradle 8.x compatibility
        run: |
          python3 - <<'PYEOF'
          import glob, re
          files = glob.glob('node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle')
          if not files:
              print("ExpoModulesCorePlugin.gradle not found - skipping")
          else:
              path = files[0]
              print(f"Patching: {path}")
              with open(path) as f:
                  content = f.read()
              for i, line in enumerate(content.split('\n'), 1):
                  if 'components' in line:
                      print(f"  line {i}: {line}")
              replacement = 'def __rc = components.findByName("release"); if (__rc) { from __rc }'
              patched = re.sub(r'\bfrom\s+components\.release\b', replacement, content)
              if patched == content:
                  patched = content.replace('from components.release', replacement)
              if patched != content:
                  with open(path, 'w') as f:
                      f.write(patched)
                  print("Patched successfully")
              else:
                  print("No components.release found - no patch needed")
          PYEOF

      - name: Patch expo-modules-core android settings.gradle for AGP resolution
        run: |
          python3 - <<'PYEOF'
          import os, sys

          base = 'node_modules/expo-modules-core/android'
          print(f"Contents of {base}/:")
          if os.path.exists(base):
              for item in sorted(os.listdir(base)):
                  print(f"  {item}")
          else:
              print("  Directory not found - skipping")
              sys.exit(0)

          settings_path = f'{base}/settings.gradle'
          pm_block = (
              'pluginManagement {\n'
              '  repositories {\n'
              '    google()\n'
              '    mavenCentral()\n'
              '    gradlePluginPortal()\n'
              '  }\n'
              '}\n'
          )

          if os.path.exists(settings_path):
              with open(settings_path) as f:
                  content = f.read()
              print(f"\nCurrent expo-modules-core/android/settings.gradle:")
              print(content)
              if 'pluginManagement' not in content:
                  content = pm_block + content
                  with open(settings_path, 'w') as f:
                      f.write(content)
                  print("Patched: prepended pluginManagement block")
              elif 'google()' not in content:
                  content = content.replace(
                      'repositories {',
                      'repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()',
                      1
                  )
                  with open(settings_path, 'w') as f:
                      f.write(content)
                  print("Patched: added google() to repositories")
              else:
                  print("No patch needed - already has pluginManagement with google()")
          else:
              print(f"\nNo settings.gradle at {settings_path} - creating one")
              with open(settings_path, 'w') as f:
                  f.write(pm_block)
              print("Created settings.gradle with pluginManagement block")

          print("\nFinal expo-modules-core/android/settings.gradle:")
          if os.path.exists(settings_path):
              with open(settings_path) as f:
                  print(f.read())
          PYEOF

      - name: Patch expo-modules-core android build.gradle - add AGP buildscript + ext
        run: |
          python3 - <<'PYEOF'
          import os

          path = 'node_modules/expo-modules-core/android/build.gradle'
          if not os.path.exists(path):
              print(f"Not found: {path}")
          else:
              with open(path) as f:
                  original = f.read()
              print("=== expo-modules-core/android/build.gradle (first 40 lines, BEFORE patch) ===")
              for i, line in enumerate(original.split('\n')[:40], 1):
                  print(f"  {i}: {line}")

              if 'com.android.tools.build:gradle' in original:
                  print("AGP already present - skip patch")
                  content = original
              else:
                  # buildscript {} MUST be first in a Gradle build file.
                  # Put SDK versions inside buildscript { ext { } } - the standard RN pattern.
                  # This makes rootProject.ext.compileSdkVersion available to the android {} block.
                  # NOTE: do NOT add kotlinVersion to ext - expo-modules-core/android/build.gradle
                  # defines a local def kotlinVersion() function. If we add kotlinVersion as an
                  # ext property, Gradle's methodMissing intercepts kotlinVersion() calls and
                  # tries to invoke the String as a method, causing "No signature of method" error.
                  prefix = (
                      'buildscript {\n'
                      '    ext {\n'
                      '        compileSdkVersion = 34\n'
                      '        buildToolsVersion = "34.0.0"\n'
                      '        minSdkVersion = 23\n'
                      '        targetSdkVersion = 34\n'
                      '        ndkVersion = "25.1.8937393"\n'
                      '    }\n'
                      '    repositories {\n'
                      '        google()\n'
                      '        mavenCentral()\n'
                      '    }\n'
                      '    dependencies {\n'
                      '        classpath("com.android.tools.build:gradle:8.1.0")\n'
                      '        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0")\n'
                      '    }\n'
                      '}\n\n'
                  )
                  content = prefix + original
                  with open(path, 'w') as f:
                      f.write(content)
                  print("Patched: prepended buildscript {ext{SDK versions without kotlinVersion}, AGP 8.1.0, Kotlin 1.8.0}")

              print("\n=== expo-modules-core/android/build.gradle (first 60 lines, AFTER patch) ===")
              for i, line in enumerate(content.split('\n')[:60], 1):
                  print(f"  {i}: {line}")
          PYEOF

      - name: Create placeholder assets (valid PNG via Python)
        run: |
          mkdir -p assets
          python3 - <<'PYEOF'
          import struct, zlib

          def make_png(w=1, h=1, r=0, g=100, b=50):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              raw = b'\x00' + bytes([r, g, b]) * w
              idat = zlib.compress(raw * h)
              return (b'\x89PNG\r\n\x1a\n' +
                      chunk(b'IHDR', ihdr) +
                      chunk(b'IDAT', idat) +
                      chunk(b'IEND', b''))

          png = make_png()
          for name in ['icon.png', 'splash.png', 'adaptive-icon.png', 'favicon.png']:
              with open(f'assets/{name}', 'wb') as f:
                  f.write(png)
              print(f'Created assets/{name}')
          PYEOF
          ls -la assets/

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Show prebuild output
        if: always()
        run: ls -la android/ 2>/dev/null || echo "No android dir"

      - name: Patch settings.gradle - add expo-modules-core to pluginManagement
        run: |
          echo "=== android/settings.gradle (before patch) ==="
          cat android/settings.gradle
          echo ""
          python3 - <<'PYEOF'
          import subprocess, sys
          result = subprocess.run(
              ['node', '--print',
               "require('path').dirname(require.resolve('expo-modules-core/package.json')) + '/android'"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print(f"ERROR: {result.stderr}")
              sys.exit(1)
          expo_core = result.stdout.strip()
          print(f"expo-modules-core/android: {expo_core}")
          with open('android/settings.gradle') as f:
              content = f.read()
          include_line = f'  includeBuild("{expo_core}")'
          if expo_core in content:
              print("Already present - no patch needed")
          elif 'pluginManagement {' in content:
              content = content.replace('pluginManagement {', f'pluginManagement {{\n{include_line}', 1)
              with open('android/settings.gradle', 'w') as f:
                  f.write(content)
              print("Patched: added to existing pluginManagement block")
          else:
              pm = (
                  'pluginManagement {\n'
                  + include_line + '\n'
                  + '  repositories {\n'
                  + '    google()\n'
                  + '    mavenCentral()\n'
                  + '    gradlePluginPortal()\n'
                  + '  }\n'
                  + '}\n'
              )
              content = pm + content
              with open('android/settings.gradle', 'w') as f:
                  f.write(content)
              print("Patched: prepended new pluginManagement block")
          print("=== android/settings.gradle (after patch) ===")
          with open('android/settings.gradle') as f:
              print(f.read())
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -2000
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Find and copy APK
        run: |
          echo "=== All APK files ==="
          find android -name "*.apk" -type f
          APK=$(find android -name "app-debug.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No app-debug.apk found"
            exit 1
          fi
          echo "APK: $APK"
          mkdir -p output
          cp "$APK" output/SA-Touring-Toolkit-v1.0.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-Touring-Toolkit-APK
          path: sa-touring-app/output/SA-Touring-Toolkit-v1.0.apk
          retention-days: 30

      - name: Done
        run: |
          echo "========================================"
          echo "  APK BUILD COMPLETE"
          echo "  Download from GitHub Actions:"
          echo "  Repo → Actions tab → this run → Artifacts"
          echo "========================================"
